name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      servers: ${{ steps.servers.outputs.servers }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build

      - name: List test servers
        id: servers
        run: echo "servers=$(./gradlew -q printTestServers | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: gainexpdisplay
          path: build/libs/GainExpDisplay-*.jar

  # Boots every test server (Paper, Purpur, Folia, Spigot) and checks the plugin works.
  # Running the test servers accepts the Minecraft EULA (https://aka.ms/MinecraftEULA).
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.build.outputs.servers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/smoke-bot/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      # Finished server jars that run-paper doesn't download (Purpur, and Spigot built with BuildTools).
      # BuildTools' working folder is left out: restored without its Maven files, it breaks the next build.
      - uses: actions/cache@v4
        with:
          path: |
            run/_servers/*.jar
            run/_servers/spigot-*/*.jar
          key: server-jars-${{ matrix.server }}-${{ hashFiles('build.gradle.kts') }}
          restore-keys: server-jars-${{ matrix.server }}-

      - name: Smoke test ${{ matrix.server }}
        run: scripts/smoke-test.sh ${{ matrix.server }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ matrix.server }}
          path: build/smoke-test/
