# ==================================================
# Заполнители (плейсхолдеры)
# %amount%      - Количество полученного опыта
# %durability%  - Текущая прочность починенного предмета
# %max%         - Максимальная прочность починенного предмета
# ==================================================

# Сообщение, отображаемое при получении игроком опыта
gain-xp: "<green><bold>Получено опыта:</bold> <yellow><bold>+%amount%</bold>"

# Сообщение, отображаемое при починке предмета с помощью «Починки» (Mending)
mending-repair: "<aqua><bold>Починка:</bold> <yellow><bold>+%amount%</bold> <green>(%durability%/%max%)"

# Сообщения обратной связи от команд
reload: "<green>Конфигурация успешно перезагружена."
command-no-permission: "<red>У вас нет прав на использование этой команды."
command-error: "<yellow>Использование: /ged reload"
