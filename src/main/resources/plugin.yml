name: GainExpDisplay
version: '${version}'
main: dev.punjarrr.gainExpDisplay.GainExpDisplay
api-version: '1.17'
folia-supported: true
authors: [PunJarrr]
description: '${description}'
website: https://modrinth.com/plugin/gainexpdisplay
commands:
  gainexpdisplay:
    description: Main command
    usage: /ged reload
    aliases: [ged]
permissions:
  gainexpdisplay.reload:
    description: Allows reloading the plugin.
    default: op
  gainexpdisplay.gainexp:
    description: Display text when gaining experience.
    default: true
  gainexpdisplay.mending:
    description: Display text when repairing items with Mending.
    default: true
